            tailwind.config = {
                theme: {
                    extend: {
                        colors: {

        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            @font-face {
                font-family: "Mojangles";
                src: url("https://cdn.jsdelivr.net/gh/hypixeloffical/DFWikiTests@main/mojangles.woff2")
                        format("woff2"),
                    url("https://cdn.jsdelivr.net/gh/lithium-labs/hsbi@main/mojangles.woff2")
                        format("woff2");
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: #040810 url("background.png") center / cover fixed
                    no-repeat;
                color: #f0fdfa;
                overflow-x: hidden;
                zoom: 0.9;
            }
            ::-webkit-scrollbar {
                width: 5px;
            }
            ::-webkit-scrollbar-track {
                background: #040810;
            }
            ::-webkit-scrollbar-thumb {
                background: #152535;
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #0ea5e9;
            }
            .nav-link {
                position: relative;
            }
            .nav-link::after {
                content: "";
                position: absolute;
                bottom: -4px;
                left: 0;
                width: 0;
                height: 2px;
                background: linear-gradient(90deg, #10b981, #0ea5e9);
                transition: width 0.3s ease;
                border-radius: 1px;
            }
            .nav-link:hover::after,
            .nav-link.active::after {
                width: 100%;
            }
            .font-mojangles {
                font-family: "Mojangles", monospace;
                letter-spacing: 0.04em;
            }
            .coming-soon {
                color: #38bdf8;
                text-shadow: 0 0 8px rgba(56, 189, 248, 0.9),
                    0 0 18px rgba(14, 165, 233, 0.8),
                    0 0 36px rgba(14, 165, 233, 0.6),
                    0 0 60px rgba(14, 165, 233, 0.4);
                animation: glow-pulse 2.4s ease-in-out infinite;
            }
            @keyframes glow-pulse {
                0%,
                100% {
                    text-shadow: 0 0 8px rgba(56, 189, 248, 0.9),
                        0 0 18px rgba(14, 165, 233, 0.8),
                        0 0 36px rgba(14, 165, 233, 0.6),
                        0 0 60px rgba(14, 165, 233, 0.4);
                    opacity: 0.92;
                }
                50% {
                    text-shadow: 0 0 12px rgba(56, 189, 248, 1),
                        0 0 26px rgba(14, 165, 233, 0.95),
                        0 0 50px rgba(14, 165, 233, 0.75),
                        0 0 80px rgba(14, 165, 233, 0.55);
                    opacity: 1;
                }
            }
            .image-box {
                position: relative;
                aspect-ratio: 16 / 9;
                border-radius: 16px;
                border: 1px solid rgba(14, 165, 233, 0.25);
                background: linear-gradient(
                    135deg,
                    rgba(10, 21, 32, 0.9),
                    rgba(4, 8, 16, 0.9)
                );
                overflow: hidden;
                box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.1),
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    inset 0 0 60px rgba(14, 165, 233, 0.05);
            }
            .image-box::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    circle at 50% 45%,
                    rgba(14, 165, 233, 0.12),
                    transparent 60%
                );
                pointer-events: none;
            }
            .image-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
