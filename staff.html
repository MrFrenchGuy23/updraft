<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff - Updraft Network</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .staff-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(77,239,255,0.2); cursor: pointer; transition: 0.3s; }
        .staff-card:hover { transform: translateY(-5px); border-color: #4defff; box-shadow: 0 0 15px rgba(77, 239, 255, 0.3); }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .modal-content { background: #0a0e1a; padding: 40px; border: 2px solid #4defff; border-radius: 20px; display: flex; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 20px; color: #4defff; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-blur-overlay" id="bgOverlay"></div>
    <audio id="ariaMath" loop><source src="ariamath.mp3" type="audio/mpeg"></audio>
    <a href="https://discord.gg/xs7XPceNvu" target="_blank" class="discord-fixed"><img src="https://assets-global.website-files.com/6257adef93867e3c84519eb1/625944adfd6054a107380f68_discord%20icon.svg" alt="Discord"></a>

    <nav class="navbar">
        <a href="home.html">Home</a>
        <a href="store.html">Store</a>
        <a href="rules.html">Rules</a>
        <a href="staff.html" class="active">Staff</a>
        <a href="support.html">Support</a>
        <a href="newimplements.html">Server Progress</a>
    </nav>

    <div class="page-wrapper">
        <h1>Our Team</h1>
        <div class="content-container">
            <div class="staff-grid">
                <div class="staff-card" onclick="openStaff('Nikepog', 'Founder', 'Founder of Updraft.')"><h3>Founder</h3><p>Nikepog</p></div>
                <div class="staff-card" onclick="openStaff('defnotsrilankan23', 'Developer', 'Lead Web Developer.')"><h3>Developer</h3><p>defnotsrilankan23</p></div>
            </div>
        </div>
    </div>

    <div id="staffModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalSkin" src="" style="width:150px; image-rendering:pixelated;">
            <div style="margin-left:20px; text-align:left;"><h2 id="modalName"></h2><h4 id="modalRank" style="color:#4defff"></h4><p id="modalBio"></p></div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        function openStaff(name, rank, bio) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalRank').innerText = rank;
            document.getElementById('modalBio').innerText = bio;
            document.getElementById('modalSkin').src = "https://minotar.net/armor/body/" + name + "/150.png";
            document.getElementById('staffModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('staffModal').style.display = 'none'; }
    </script>
</body>
</html>
